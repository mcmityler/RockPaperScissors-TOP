<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link href="./styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="./rock-icon.png">
</head>
<body>
    <div class="game">
        <div class="selections">
            <button class="rock choice">
                <div>
                    <img src="./rock-icon.png" alt="Image of a rock" />
                    <p>Rock</p>
                </div>
            </button>
            <button class="paper choice">
                <div>
                    <img src="./rock-icon.png" alt="Image of paper" />
                    <p>Paper</p>
                </div>
            </button>
            <button class="scissors choice">
                <div>
                    <img src="./rock-icon.png" alt="Image of scissors" />
                    <p>Scissors</p>
                </div>
            </button>
        </div>
        <div class="outputs">
            <p class="roundOutput text">Round Results</p>
            <p class="scoreOutput text">Score</p>
            <p class="gameOutput text">First to 5 points wins!</p>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
